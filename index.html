ailure is ____.","k":"lack of maintenance. The leading reason for erosion and sediment control plan failure is lack of maintenance."},{"b":"Sediment Control (NC Sediment Control Law)","a":false,"f":"Sediment is controlled most effectively ____.","k":"near the source. Sediment is controlled most effectively near the source."},{"b":"Sediment Control (NC Sediment Control Law)","a":false,"f":"Temporary Sediment Trap: Minimum flood pool volume is ____ per acre of drained area. (Width at top 2 feet)","k":"1,800 cubic feet. Temporary Sediment Trap: Minimum flood pool volume is 1,800 cubic feet per acre of drained area. (Width at top 2 feet)"},{"b":"Sediment Control (NC Sediment Control Law)","a":false,"f":"When soil particles slow enough in water to settle down to the bottom, this process is called ____.","k":"sedimentation. When soil particles slow enough in water to settle down to the bottom, this process is called sedimentation."},{"b":"Sediment Control (NC Sediment Control Law)","a":false,"f":"Temporary gravel entrance: ____ wide, ____ thick, and at least ____ long.","k":"12' / 6\" / 50'. Temporary gravel entrance 12' wide, 6\" thick and at least 50' long."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"Area of any triangle or right triangle = ____.","k":"B x H / 2. Area of any triangle = Base x Height / 2."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"Hypotenuse of a right triangle (C) = ____.","k":"square root of (B\u00b2 + H\u00b2). Hypotenuse = C. C = \u221a(B\u00b2 + H\u00b2)."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"Area of a square = ____.","k":"S\u00b2 (side squared), or S x S. Area of square = S squared (side squared), or Area = S x S."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"Area of a rectangle = ____. Perimeter of a rectangle = ____.","k":"B x H / 2(B x H). Area = B x H. Perimeter = 2(BxH)."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"Area of a trapezoid = ____.","k":"(A+B)/2 x H. Area = (A + B)/2 x H."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"Area of a circle = ____. Circumference of a circle = ____.","k":"3.14 x R x R / 3.14 x D. Area = 3.14 x R x R. Circumference = 3.14 x D."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"Volume of a cube = ____.","k":"L x W x H. Volume (V) = L x W x H."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"Volume of a cylinder = ____.","k":"Area of A x B. V = Area of A x B."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"Volume of a cone = ____.","k":"(Area of A x B) / 3. V = Area of A x B, divided by 3."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"Area conversions: 144 square inches = ____. 9 square feet = ____. 100 square feet = ____.","k":"1 square foot / 1 square yard / 1 square of roofing material. 144 square inches = 1 square foot. 9 square feet = 1 square yard. 100 square feet = 1 square of roofing material."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"Volume conversions: 1,728 cubic inches = ____. 27 cubic feet = ____.","k":"1 cubic foot / 1 cubic yard. 1,728 cubic inches = 1 cubic foot. 27 cubic feet = 1 cubic yard."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"1 cubic foot = ____ gallons. 1 gallon = ____ cubic inches.","k":"7.4850 / 231. 1 cubic foot = 7.4850 gallons. 1 gallon = 231 cubic inches."},{"b":"Area, Volume & Conversion Formulas","a":false,"f":"1 gallon = ____ pounds (water). 1 cubic foot = ____ pounds (water).","k":"8.345 / 62.3. 1 gallon = 8.345 pounds. 1 cubic foot = 62.3 pounds."},{"b":"Miscellaneous","a":false,"f":"Preferred safety traffic marker is a ____ reflectorized barrel or drum.","k":"42\". Preferred safety traffic marker 42\" reflectorized barrel or drum."},{"b":"Miscellaneous","a":false,"f":"Use of a hardhat with a jackhammer is ____.","k":"not required. Use of a hardhat with a jackhammer not required."},{"b":"Miscellaneous","a":false,"f":"A ____ is used to measure soil bearing capacity.","k":"penetrometer. A penetrometer is used to measure soil bearing capacity."},{"b":"Miscellaneous","a":false,"f":"Lap durawire ____.","k":"8 inches. Lap durawire 8 inches."}];

// ---------- build decks (preserve first-seen order) ----------
const allCards = CARDS.map((c, i) => ({ b: c.b, a: c.a, f: c.f, k: c.k, id: i }));
const deckOrder = [];
const deckMap = {};
allCards.forEach((c) => {
  if (!deckMap[c.b]) {
    deckMap[c.b] = { name: c.b, allowed: c.a, cards: [] };
    deckOrder.push(c.b);
  }
  deckMap[c.b].cards.push(c);
});
const decks = deckOrder.map((name) => deckMap[name]);

// ---------- state ----------
const state = {
  progress: {},          // id -> 'known' | 'review'
  loaded: false,
  view: 'decks',          // 'decks' | 'study'
  activeDeckIdx: null,
  studyAll: false,
  reviewOnly: false,
  doShuffle: false,
  sessionIds: [],
  pointer: 0,
  flipped: false,
};

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- persistence ----------
// Uses window.storage when available (inside Claude.ai's artifact environment).
// Falls back to localStorage automatically when this file is opened standalone
// (e.g. emailed as an attachment and opened directly in a browser), so progress
// still saves either way.
const STORAGE_KEY = 'gc-flashcard-progress';
const hasClaudeStorage = () => typeof window.storage !== 'undefined' && typeof window.storage.get === 'function';

async function storageGet(key) {
  if (hasClaudeStorage()) {
    try { return await window.storage.get(key, false); }
    catch (e) { /* fall through to localStorage */ }
  }
  try {
    const raw = window.localStorage.getItem(key);
    return raw ? { key, value: raw } : null;
  } catch (e) {
    return null;
  }
}

async function storageSet(key, value) {
  if (hasClaudeStorage()) {
    try { return await window.storage.set(key, value, false); }
    catch (e) { /* fall through to localStorage */ }
  }
  try {
    window.localStorage.setItem(key, value);
    return { key, value };
  } catch (e) {
    return null;
  }
}

async function loadProgress() {
  try {
    const res = await storageGet(STORAGE_KEY);
    if (res && res.value) state.progress = JSON.parse(res.value);
  } catch (e) {
    // no saved progress yet
  }
  state.loaded = true;
  render();
}

async function saveProgress() {
  try {
    await storageSet(STORAGE_KEY, JSON.stringify(state.progress));
  } catch (e) {
    console.error('Storage save failed', e);
  }
}

function gradeCard(id, status) {
  state.progress[id] = status;
  saveProgress();
}

function resetAllProgress() {
  state.progress = {};
  saveProgress();
  render();
}

// ---------- session building ----------
function buildSession(cardList, opts) {
  let pool = cardList;
  if (opts.reviewOnly) pool = pool.filter((c) => state.progress[c.id] === 'review');
  let ids = pool.map((c) => c.id);
  if (opts.shuffle) ids = shuffleArr(ids);
  return ids;
}

function startDeck(idx) {
  state.activeDeckIdx = idx;
  state.studyAll = false;
  state.sessionIds = buildSession(decks[idx].cards, { reviewOnly: state.reviewOnly, shuffle: state.doShuffle });
  state.pointer = 0;
  state.flipped = false;
  state.view = 'study';
  render();
}

function startAll() {
  state.studyAll = true;
  state.activeDeckIdx = null;
  state.sessionIds = buildSession(allCards, { reviewOnly: state.reviewOnly, shuffle: true });
  state.pointer = 0;
  state.flipped = false;
  state.view = 'study';
  render();
}

function restartSession() {
  const source = state.studyAll ? allCards : decks[state.activeDeckIdx].cards;
  state.sessionIds = buildSession(source, { reviewOnly: state.reviewOnly, shuffle: state.doShuffle || state.studyAll });
  state.pointer = 0;
  state.flipped = false;
  render();
}

function currentCard() {
  if (!state.sessionIds.length) return null;
  const idx = Math.min(state.pointer, state.sessionIds.length - 1);
  return allCards[state.sessionIds[idx]];
}

function goNext() {
  state.flipped = false;
  state.pointer = Math.min(state.pointer + 1, state.sessionIds.length - 1);
  render();
}
function goPrev() {
  state.flipped = false;
  state.pointer = Math.max(state.pointer - 1, 0);
  render();
}

function handleGrade(status) {
  const c = currentCard();
  if (!c) return;
  gradeCard(c.id, status);
  render();
  setTimeout(() => {
    if (state.pointer < state.sessionIds.length - 1) goNext();
    else render();
  }, 260);
}

function deckProgress(deck) {
  const known = deck.cards.filter((c) => state.progress[c.id] === 'known').length;
  return { known, total: deck.cards.length };
}

// ---------- rendering ----------
const app = document.getElementById('app');

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function render() {
  if (state.view === 'decks') renderDecks();
  else renderStudy();
}

function renderDecks() {
  const totalCards = allCards.length;
  const knownCount = Object.values(state.progress).filter((v) => v === 'known').length;
  const reviewCount = Object.values(state.progress).filter((v) => v === 'review').length;

  const deckCards = decks.map((deck, idx) => {
    const { known, total } = deckProgress(deck);
    const pct = total ? Math.round((known / total) * 100) : 0;
    const badgeClass = deck.allowed ? 'allowed' : 'notallowed';
    const badgeText = deck.allowed ? 'IN THE EXAM ROOM' : 'NO BOOK \u2014 MEMORIZE';
    const cardClass = deck.allowed ? '' : 'not-allowed';
    return `
      <button class="deck-card ${cardClass}" data-action="open-deck" data-idx="${idx}">
        <div class="deck-head">
          <span class="badge ${badgeClass}">${badgeText}</span>
          <span class="deck-count">${total} cards</span>
        </div>
        <div class="deck-name">${esc(deck.name)}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${known}/${total} known</div>
      </button>
    `;
  }).join('');

  app.innerHTML = `
    <div class="top-row">
      <div>
        <div class="eyebrow">NC GENERAL CONTRACTOR &middot; PSI EXAM</div>
        <h1 class="title stencil">FIELD FLASHCARDS</h1>
      </div>
      <div class="stat-block mono">
        <div>${knownCount} / ${totalCards} known</div>
        <div class="flagged">${reviewCount} flagged for review</div>
      </div>
    </div>
    <p class="intro">Pulled from your study guide, organized by reference book. Each card blanks the key fact &mdash;
      flip to check yourself and see which book to cite. Orange tabs are books you can bring into the exam room;
      gray tabs you can't, so those facts need to be memorized cold.</p>

    <div class="controls-row">
      <button class="btn-primary" data-action="study-all">STUDY ALL (SHUFFLED)</button>
      <label class="chk-label"><input type="checkbox" id="chk-review-only" ${state.reviewOnly ? 'checked' : ''}/> review-flagged only</label>
      <label class="chk-label"><input type="checkbox" id="chk-shuffle" ${state.doShuffle ? 'checked' : ''}/> shuffle within deck</label>
      <button class="btn-ghost" data-action="reset-all">RESET ALL PROGRESS</button>
    </div>

    <div class="deck-grid">${deckCards}</div>
    ${!state.loaded ? '<div class="loading-note">loading saved progress&hellip;</div>' : ''}
  `;

  document.getElementById('chk-review-only').addEventListener('change', (e) => { state.reviewOnly = e.target.checked; });
  document.getElementById('chk-shuffle').addEventListener('change', (e) => { state.doShuffle = e.target.checked; });
}

function renderStudy() {
  const card = currentCard();
  const total = state.sessionIds.length;

  if (!card) {
    app.innerHTML = `
      <div class="empty-state">
        <div class="stencil" style="font-size:22px;color:#F0A430;">NO CARDS TO SHOW</div>
        <div class="msg">${state.reviewOnly ? 'Nothing marked &ldquo;study again&rdquo; in this deck yet.' : 'This deck is empty.'}</div>
        <button class="btn-primary" data-action="exit">BACK TO DECKS</button>
      </div>
    `;
    return;
  }

  const deckName = state.studyAll ? 'All Books (mixed)' : decks[state.activeDeckIdx].name;
  const deckAllowed = state.studyAll ? null : decks[state.activeDeckIdx].allowed;
  const status = state.progress[card.id];
  const atStart = state.pointer === 0;
  const atEnd = state.pointer >= total - 1;

  const badgeHtml = deckAllowed !== null
    ? `<span class="badge ${deckAllowed ? 'allowed' : 'notallowed'}" style="margin-top:8px;display:inline-block;">${deckAllowed ? 'IN THE EXAM ROOM' : 'NO BOOK \u2014 MEMORIZE'}</span>`
    : '';

  const actionHtml = !state.flipped
    ? `<div class="action-row single"><button class="btn-show" data-action="show-answer">SHOW ANSWER</button></div>`
    : `<div class="action-row">
         <button class="btn-review" data-action="grade-review">STUDY AGAIN</button>
         <button class="btn-known" data-action="grade-known">GOT IT</button>
       </div>`;

  const statusChip = status
    ? `<span class="status-chip ${status}">${status === 'known' ? 'MARKED KNOWN' : 'MARKED REVIEW'}</span>`
    : `<span></span>`;

  app.innerHTML = `
    <div class="study-wrap">
      <div class="study-top">
        <button class="link-btn" data-action="exit">&larr; DECKS</button>
        <div class="mono" style="font-size:12px;color:#9FB0C3;">${state.pointer + 1} / ${total}</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${((state.pointer + 1) / total) * 100}%"></div></div>

      <div class="deck-title-block">
        <div class="name">${esc(deckName)}</div>
        ${badgeHtml}
      </div>

      <div class="flip-scene">
        <div class="flip-card ${state.flipped ? 'flipped' : ''}" data-action="flip">
          <div class="flip-face front">
            <div class="face-header">
              <span class="face-label">FRONT</span>
              <span class="ring-holes"><span class="ring-hole"></span><span class="ring-hole"></span><span class="ring-hole"></span></span>
            </div>
            <div class="face-body"><p class="face-front-text">${esc(card.f)}</p></div>
            <div class="face-footer">tap card or press space to flip</div>
          </div>
          <div class="flip-face back">
            <div class="face-header">
              <span class="face-label">ANSWER</span>
              <span class="ring-holes"><span class="ring-hole"></span><span class="ring-hole"></span><span class="ring-hole"></span></span>
            </div>
            <div class="face-body"><p class="face-back-text">${esc(card.k)}</p></div>
            <div class="face-footer">source: ${esc(card.b)}</div>
          </div>
        </div>
      </div>

      ${actionHtml}

      <div class="nav-row">
        <button class="link-btn" data-action="prev" ${atStart ? 'disabled' : ''}>&larr; PREV</button>
        ${statusChip}
        <button class="link-btn" data-action="next" ${atEnd ? 'disabled' : ''}>NEXT &rarr;</button>
      </div>

      <div class="bottom-controls">
        <label class="chk-label"><input type="checkbox" id="chk-review-only-study" ${state.reviewOnly ? 'checked' : ''}/> review-flagged only</label>
        <label class="chk-label"><input type="checkbox" id="chk-shuffle-study" ${state.doShuffle ? 'checked' : ''}/> shuffle</label>
        <button class="link-btn" data-action="restart">&#8635; restart deck</button>
      </div>
    </div>
  `;

  document.getElementById('chk-review-only-study').addEventListener('change', (e) => {
    state.reviewOnly = e.target.checked;
    restartSession();
  });
  document.getElementById('chk-shuffle-study').addEventListener('change', (e) => {
    state.doShuffle = e.target.checked;
    restartSession();
  });
}

// ---------- event delegation ----------
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.getAttribute('data-action');
  switch (action) {
    case 'open-deck': startDeck(parseInt(el.getAttribute('data-idx'), 10)); break;
    case 'study-all': startAll(); break;
    case 'reset-all':
      if (confirm("Reset all progress on every deck? This can't be undone.")) resetAllProgress();
      break;
    case 'exit': state.view = 'decks'; render(); break;
    case 'flip': state.flipped = !state.flipped; render(); break;
    case 'show-answer': state.flipped = true; render(); break;
    case 'grade-review': handleGrade('review'); break;
    case 'grade-known': handleGrade('known'); break;
    case 'prev': goPrev(); break;
    case 'next': goNext(); break;
    case 'restart': restartSession(); break;
  }
});

document.addEventListener('keydown', (e) => {
  if (state.view !== 'study') return;
  if (e.key === ' ') { e.preventDefault(); state.flipped = !state.flipped; render(); }
  else if (e.key === 'ArrowRight') goNext();
  else if (e.key === 'ArrowLeft') goPrev();
  else if (e.key === '1' && state.flipped) handleGrade('review');
  else if (e.key === '2' && state.flipped) handleGrade('known');
});

// ---------- init ----------
render();
loadProgress();
</script>
</body>
</html>
