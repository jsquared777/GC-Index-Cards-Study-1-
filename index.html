<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GC Exam Field Flashcards</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #16283F;
  color: #EDE8DC;
  font-family: 'IBM Plex Sans', sans-serif;
  min-height: 100vh;
}
.stencil { font-family: 'Oswald', sans-serif; letter-spacing: 0.02em; }
.mono { font-family: 'IBM Plex Mono', monospace; }

#app { max-width: 1000px; margin: 0 auto; padding: 28px 18px 60px; }

.hidden { display: none !important; }

/* ---------- deck list ---------- */
.top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
.eyebrow { font-size: 12px; letter-spacing: 0.25em; color: #F0A430; margin-bottom: 4px; }
h1.title { font-size: 32px; font-weight: 600; color: #F6F1E4; margin: 0; line-height: 1.15; }
.stat-block { text-align: right; font-size: 13px; color: #9FB0C3; }
.stat-block .flagged { color: #E8873B; }
.intro { color: #9FB0C3; max-width: 640px; margin: 14px 0 22px; font-size: 14px; line-height: 1.5; }

.controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 26px; }
.btn-primary {
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700;
  padding: 10px 16px; border-radius: 8px; background: #F0A430; color: #16283F;
  border: none; cursor: pointer;
}
.btn-primary:hover { filter: brightness(1.1); }
.chk-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C7D2DE; font-family: 'IBM Plex Mono', monospace; cursor: pointer; user-select: none; }
.btn-ghost {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  padding: 9px 12px; border-radius: 8px; background: transparent; color: #9FB0C3;
  border: 1px solid #35507A; cursor: pointer; margin-left: auto;
}
.btn-ghost:hover { color: #F0A430; border-color: #F0A430; }

.deck-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
@media (min-width: 720px) { .deck-grid { grid-template-columns: 1fr 1fr; } }

.deck-card {
  position: relative;
  text-align: left; border-radius: 14px; padding: 20px; cursor: pointer;
  background: #FAF6EC; color: #1C2B3A; border: none;
  box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 10px 24px rgba(0,0,0,0.35);
  transition: transform 0.15s ease;
}
.deck-card:hover { transform: translateY(-2px); }
.deck-card.not-allowed { background: #F0EDE6; }
.deck-card::before {
  content: '';
  position: absolute; top: -10px; left: 18px; width: 54px; height: 14px;
  border-radius: 4px 4px 0 0; background: inherit;
}
.deck-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; padding: 4px 8px; border-radius: 5px; white-space: nowrap; }
.badge.allowed { background: #F0A430; color: #16283F; }
.badge.notallowed { background: #B85C38; color: #FAF6EC; }
.deck-count { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5C6B7A; }
.deck-name { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 600; line-height: 1.3; margin-bottom: 12px; }
.progress-track { height: 6px; width: 100%; background: #0F1E31; border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; background: #5FA07A; border-radius: 999px; }
.progress-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C6B7A; margin-top: 6px; }

/* ---------- study view ---------- */
.study-wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; min-height: 90vh; }
.study-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.link-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9FB0C3; background: none; border: none; cursor: pointer; }
.link-btn:hover { color: #F0A430; }
.link-btn:disabled { opacity: 0.3; cursor: default; }
.bar-track { height: 4px; width: 100%; background: #0F1E31; border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
.bar-fill { height: 100%; background: #F0A430; }

.deck-title-block { text-align: center; margin-bottom: 14px; }
.deck-title-block .name { font-family: 'Oswald', sans-serif; font-size: 15px; color: #F6F1E4; }

.flip-scene { perspective: 1800px; flex: 1; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.flip-card { position: relative; width: 100%; min-height: 320px; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(.4,.2,.2,1); cursor: pointer; }
.flip-card.flipped { transform: rotateY(180deg); }
.flip-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 14px; padding: 28px; display: flex; flex-direction: column;
  background: #FAF6EC; color: #1C2B3A;
  box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 10px 24px rgba(0,0,0,0.35);
}
.flip-face.back { transform: rotateY(180deg); background: #F3EEDD; }
.face-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.face-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.15em; color: #8A7A5C; }
.ring-holes { display: flex; gap: 5px; }
.ring-hole { width: 10px; height: 10px; border-radius: 999px; background: #16283F; box-shadow: inset 0 1px 3px rgba(0,0,0,0.6); }
.face-body { flex: 1; display: flex; align-items: center; }
.face-front-text { font-family: 'Oswald', sans-serif; font-size: 22px; line-height: 1.4; }
.face-back-text { font-size: 17px; line-height: 1.6; }
.face-footer { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8A7A5C; text-align: center; margin-top: 14px; }

.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.action-row.single { grid-template-columns: 1fr; }
.btn-show { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; padding: 14px; border-radius: 10px; background: #F0A430; color: #16283F; border: none; cursor: pointer; width: 100%; }
.btn-show:hover { filter: brightness(1.1); }
.btn-review { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; padding: 14px; border-radius: 10px; background: #B85C38; color: #FAF6EC; border: none; cursor: pointer; }
.btn-review:hover { filter: brightness(1.1); }
.btn-known { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; padding: 14px; border-radius: 10px; background: #5FA07A; color: #0F1E31; border: none; cursor: pointer; }
.btn-known:hover { filter: brightness(1.1); }

.nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
.status-chip { font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 4px 8px; border-radius: 5px; }
.status-chip.known { background: #5FA07A; color: #0F1E31; }
.status-chip.review { background: #B85C38; color: #FAF6EC; }

.bottom-controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 22px; flex-wrap: wrap; }

.empty-state { min-height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 0 20px; }
.empty-state .msg { color: #9FB0C3; max-width: 340px; }
.loading-note { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C6B7A; margin-top: 20px; }
</style>
</head>

<div id="app"></div>
<script>
const CARDS = 
[{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"1-1 to 1-3; You must be familiar with the elements of a Business Plan and common ____.","k":"Business Plan pitfalls. You must be familiar with the elements of a Business Plan and common Business Plan pitfalls, for the exam."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"2-1 to 2-7; Know the advantages and disadvantages of the different types of ____.","k":"business structures. Know the advantages and disadvantages of the different types of business structures."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"A Limited Partner's liability is limited to the amount they invested. A major disadvantage of a general partnership is ____ for all general partners.","k":"unlimited personal liability. A Limited Partners Liability is limited to the amount they invested. A major disadvantage of a general partnership is unlimited personal liability for all general partners."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"A Contractor's license is required for any contractor undertaking a construction contract of ____ or more.","k":"$40,000. 3-2; A Contractor's license is required for any contractor undertaking a construction contract $40,000 or more. (Display of license, change of address within 30 days.)"},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Licenses expire annually on ____.","k":"January 1st. Licenses expire annually on January 1st."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Amount of working capital required for a limited license is ____. Project limitation for a limited license is ____.","k":"$17,000 / $750,000. Amount of working capital required for a limited license is $17,000. Project limitation for a limited license is $750,000."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"North Carolina shares reciprocity rights with ____, ____, ____, ____, ____, and ____.","k":"Alabama / Florida / Georgia / Louisiana / Mississippi / South Carolina / Tennessee. North Carolina shares reciprocity rights with Alabama, Florida, Georgia, Louisiana, Mississippi, South Carolina, and Tennessee."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"4-5; Who pays for worker's compensation?","k":"Employer. Employer pays for worker's compensation."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"If you are a sole proprietorship, partnership, or LLC, you are required by law to carry worker's compensation if you have ____ or more employees.","k":"three. If you are a sole proprietorship, partnership, or LLC, you are required by law to carry worker's compensation if you have three or more employees."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"The Heard Act was enacted in ____ allowing the use of surety bonds for Federally funded projects. In ____ the Miller Act replaced the Heard Act.","k":"1894 / 1935. The Heard Act was enacted in 1894 allowing the use of surety bonds for Federally funded projects. In 1935 the Miller Act replaced the Heart Act."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"The Miller Act requires that all Federal projects exceeding ____ must be bonded.","k":"$100,000. The Miller Act requires that all Federal projects exceeding $100,000 must be bonded."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"A Performance Bond is normally ____ of the contracted amount.","k":"100%. A Performance Bond is normally 100% of the contracted amount."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"A Payment Bond is required at ____ of the contract amount for projects less than $1,000,000.","k":"50%. A Payment Bond is required for the following amounts: 50% of the contract amount for projects less than $1,000,000."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"A Payment Bond is required at ____ of the contract amount for projects between $1,000,000 and $5,000,000.","k":"40%. A Payment Bond is required at 40% of the contract amount for projects between $1,000,000. and $5,000,000."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"For contracts in excess of $5,000,000, a Payment Bond of ____ is required.","k":"$2.5 million. $2.5 million payment bonds for contract in excess of $5,000,000."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"The most accurate method of estimating is the ____ method.","k":"quantity take-off. The most accurate method of estimating is the quantity take-off method."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Items considered labor burden include (become familiar for the exam): ____.","k":"payroll taxes, insurance, benefits, etc. Become familiar with items considered labor burden for the exam."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"What is considered a job cost? (4 categories)","k":"Materials, Labor, Equipment, Project Overhead. What is considered a job cost: Materials, Labor, Equipment, Project Overhead."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Be familiar with the key elements of a contract, also offer and counteroffer. Key elements include: ____.","k":"offer, acceptance, consideration, competent parties, legal purpose. Be familiar with the key elements of a contract. Also offer and counteroffer."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Changes to the project award (before signing) are called ____. Changes after the contract award is signed and executed are called ____.","k":"addenda / modifications. Changes to the project award are called addenda. Changes after the contract award is signed and executed are called modifications."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Under most circumstances, oral agreements are just as binding as written agreements. Oral agreements present a challenge because it is difficult to prove what ____ if a dispute arises.","k":"terms were agreed upon. Under most circumstances, oral agreements are just as binding as written agreements. Oral agreements present a challenge, because it is difficult to prove what terms were agreed upon if a dispute arises."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"The weakness of the bar chart and calendar scheduling methods is that they don't show the ____ of the other activities.","k":"interdependencies. The weakness of the bar chart and calendar scheduling methods are they don't show the interdependencies of the other activities."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"____ deliveries will keep your inventory cost low. Also, less inventory onsite will cut down the risk of theft or vandalism.","k":"Just in time. Just in time deliveries will keep your inventory cost low. Also, less inventory onsite will cut down the risk of theft or vandalism."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"When materials arrive on a jobsite, they must be checked for ____ and ____.","k":"quantity / quality. When materials arrive on a jobsite, they must be checked for quantity and quality."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"You must become familiar with the laws for hiring minors and ____ deadlines.","k":"New Hire reporting. New Hire reporting deadlines. Be familiar with the laws for hiring minors."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"You must become familiar with the ____ requirements: a workweek, minimum wage, and FLSA penalty for the exam.","k":"Fair Labor Standards Act. You must become familiar with the Fair Labor Standards Act requirements, a workweek, minimum wage, and FLSA es / 5 years. Employers are not required to keep OSHA injury records unless he has more than 10 employees. OSHA records must be retained for 5 years."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Lead paint was used before ____ in residential housing.","k":"1978. Lead paint was used before 1978 in residential housing."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"A ____ is the proof that a transaction took place.","k":"source document. A source document is the proof that a transaction took place. Become familiar with examples of source documents."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"The Balance Sheet equation is comprised of assets, liabilities and owner's equity: Assets = ____ + ____.","k":"Liabilities / Owner's Equity. The Balance Sheet equation is comprised of assets, liabilities and owner's equity. Assets = Liabilities + Owner's Equity."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"The Income Statement is sometimes called the ____.","k":"Profit and Loss Statement. The Income Statement is sometimes called the Profit and Loss Statement."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Accrual Method vs Cash: the ____ Method will not match revenues with expenses.","k":"Cash. Accrual Method vs Cash. The Cash Method will not match revenues with expenses."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Federal identification numbers are assigned by the ____.","k":"IRS. Federal identification numbers are assigned by the IRS."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"The IRS Publication Circular \"____\" is the Employer's tax guide for calculating, withholding, and depositing employees' taxes.","k":"E. The IRS Publication Circular \"E\" is the Employer's tax guide for calculating, withholding, and depositing employees' taxes."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"The W-2 Form is due to all employees by ____.","k":"January 31st. The W-2 Form is due to all employees by January 31st."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"To report FUTA taxes use Form ____.","k":"940. To report FUTA taxes use Form 940."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Form ____ is used to report payments to subcontractors.","k":"1099. Form 1099 is used to report payments to subcontractors."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"[LIEN DEADLINE] A claim of lien must be filed within ____ days.","k":"120 days. A claim of lien must be filed within 120 days. (MEMORIZE - hard legal deadline.)"},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"[LIEN DEADLINE] A lawsuit to foreclose on the lien must be filed within ____ days.","k":"180 days. A lawsuit to foreclose on the lien must be filed within 180 days. (MEMORIZE - hard legal deadline.)"},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"16-1; Who is entitled to file a mechanics lien?","k":"(Know the categories - contractors, subcontractors, suppliers who furnish labor/materials.) Who is entitled to file a mechanics lien."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"(e) A certificate of license shall expire on the ____ day of January.","k":"1st. (e) A certificate of license shall expire on the 1st day of January."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"(f) After a lapse of ____ years, no renewal shall be in effect.","k":"4 years. (f) After a lapse of 4 years no renewal shall be in effect."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"You have ____ to withdraw a bid.","k":"72 hours. 72 hours to withdraw a bid."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"A false statement (on a license application) is a ____.","k":"misdemeanor. False statement a misdemeanor."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Misc. Exam Question: ____ must be included in a contract.","k":"Identities of the parties. Identities of the parties must be included in a contract."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Misc. Exam Question: Nearly all public contracts are ____.","k":"lump sum. Nearly all public contracts are lump sum."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Misc. Exam Question: A superintendent's year-end bonus would be considered a(n) ____ cost.","k":"indirect. Superintendent's year-end bonus would be considered an indirect cost."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Misc. Exam Question: A ____ is not a contract document.","k":"Letter of Intent. A Letter of Intent is not a contract document."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"Misc. Exam Question: All employees must file a ____ with their employer.","k":"W-4. All employees must file a W-4 with their employer."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"[MEMORIZE] When the Qualifier leaves employment, the Board must be notified no later than ____ after the date of separation.","k":"10 days. When Qualifier leaves employment, The Board must be notified no later than 10 days after the date of separation."},{"b":"NASCLA Business, Law & Project Management (10th Ed.)","a":true,"f":"[MEMORIZE] You have ____ to replace a qualifying individual.","k":"90 days. You have 90 days to replace a qualifying individual."},{"b":"NC Administrative Code 2024","a":true,"f":"107.1.1; ____ inspections shall be made after the trenches are excavated, all grade stakes are installed, all reinforcing steel and supports are in place and tied, and all necessary forms are in place and braced before any concrete is placed.","k":"Footi eakest."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"____ and most tooled mortar joints are very effective in resisting rain penetration; the ____ joint is the most popular mortar joint.","k":"Concave / concave. Concave and most tooled mortar joints are very effective in resisting rain penetration. The concave joint is the most popular mortar joint."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"(FTX) unglazed facing tile has a high degree of ____.","k":"mechanical perfection. (FTX) unglazed facing tile has a high degree of mechanical perfection."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"An 8x8x16 CMU (sand and gravel) weighs ____ lbs.","k":"40 lbs. Figure 8-3; A 8x8x16 CMU (sand and gravel) weighs 40 lbs."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"The actual size of an 8x8x16 CMU is ____.","k":"7 5/8\" x 7 5/8\" x 15 5/8\". The actual size of an 8x8x16 CMU is 7 5/8\"x 7 5/8\"x 15 5/8\"."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"The intended size of a mortar joint is ____ of an inch.","k":"3/8. The intended size of mortar joint is 3/8 of an inch."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"The two-core block is typically stronger than a three-core block. The two-core block is used when ____ must align in the core holes.","k":"reinforcing bars. The two core block is typically stronger than a three core block. The two core block is used when reinforcing bars must align in the core holes."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"Masonry glass block joints are typically ____ on all sides.","k":"1/4 inch. Figure 8-37; Masonry glass block joints are typically 1/4\" on all sides."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"____ is an excellent sill material. The fact that it is one piece ensures better protection against water leakage.","k":"Limestone. Limestone is an excellent sill material. The fact that it is one piece ensures better protection against water leakage."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"The basic mortar ingredients include Portland Cement, ____, and Sand.","k":"Hydrated Lime. The basic mortar ingredients include Portland Cement, Hydrated Lime, and Sand."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"Hydrated lime is quicklime that has been ____ before packaging.","k":"slaked. Hydrated lime is quicklime that has been slaked before packaging (formed into a putty by combining it with water)."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"Only Type ____ hydrated lime is recommended for masonry mortar.","k":"Type S. Only Type S hydrated lime is recommended for masonry mortar."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"Mortar may be re-tempered by adding ____ to make it more workable. Mortar should be discarded ____ after mixing.","k":"water / 2-1/2 hours. Mortar may be re-tempered by adding water to make it more workable. Mortar should be discarded 2-1/2 hours after mixing."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"The compressive strength of mortar increases as the ____ content is increased.","k":"cement. The compressive strength of mortar increases as the cement content is increased."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"____ is the most significant property of hardened mortar, but it is also the most difficult to predict.","k":"Bond strength. Bond strength is the most significant property of hardened mortar, but it is also the most difficult to predict."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"Type ____ Mortar is used for unreinforced masonry below grade and in contact with earth (foundations, retaining walls, walks, sewers, manholes).","k":"Type M. Type M Mortar is used for unreinforced masonry below grade and in contact with earth. Such structures include foundations, retaining walls, walks, sewers, and manholes."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"Type ____ Mortar is recommended for unreinforced masonry where maximum flexural (bending) strength is required. When wind speeds exceed ____ mph, this type is used.","k":"Type S / 80 mph. Type S Mortar is recommended for unreinforced masonry where maximum flexural (bending) strength is required. (When wind speeds exceed 80mph type S Mortar is used.)"},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"All reinforcing rods or bars used in masonry walls must have ____ of an inch mortar coverage.","k":"5/8. All reinforcing rods or bars used in masonry walls must have 5/8 of an inch mortar coverage."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"A ____ anchor is used to connect a partition wall to a bearing wall.","k":"strap. Figure 11-22; A strap anchor is used to connect a partition wall to a bearing wall."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"A ____ is used to cut brick when the cut edge will be hidden by the mortar.","k":"brick hammer. A brick hammer is used to cut brick when the cut edge will be hidden by the mortar."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"A corner pole (also known as a ____ pole) is used to insure the height of each course of block or brick.","k":"story pole. A corner pole also known as a story pole is used to insure the height of each course of block or brick."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"You place wall ties in the mortar ____ of an inch from either edge of the masonry unit.","k":"5/8 inch. You place wall ties in the mortar 5/8 of an inch from either edge of the masonry unit."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"To clean brick, use diluted ____.","k":"Hydrochloric Acid. To clean brick use diluted Hydrochloric-Acid."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"When sandblasting a masonry wall, the pressure should be ____.","k":"60-100 psf. When sandblasting a masonry wall, the pressure should be 60-100 psf."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"The most common air-space for a cavity wall is ____.","k":"2 inches. The most common air-space for a cavity wall is 2 inches."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"____ metal ties are used in residential veneer construction to anchor the veneer to frame or masonry backing.","k":"Corrugated. Corrugated metal ties are used in residential veneer construction to anchor the veneer to frame or masonry backing."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"A full mortar bed is furrowed with a ____, and is used to ensure a good bond between the footing and the bed course.","k":"trowel. A full mortar bed is furrowed with a trowel. A full mortar bed is used to ensure a good bond between the footing and the bed course."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"Position blocks in a wall with the wide flange on ____ to provide a wider space for the bed joint.","k":"the top. Position blocks in a wall with the wide flange on the top to provide a wider space for the bed joint."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"A ____ is used to make sure that the mason's line does not sag. Hold a mason's line ____ away from the block or brick.","k":"trig / 1/16\". A trig is used to make sure that the mason's line does not sag. Hold a mason's line 1/16\" away from the block or brick."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"A ____ diameter bar is usually used for a 3/8\" concave mortar joint. A ____ square bar is used for making a 3/8\" V-joint.","k":"5/8\" / 1/2\". Note 11; A 5/8\" diameter bar is usually used for a 3/8\" concave mortar joint. A 1/2\" square bar is used for making a 3/8\" V-joint."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"Control joints should be sealed with caulking compound after the mortar has been raked out to a depth of ____ of an inch.","k":"3/4 inch. Control joints should be sealed with caulking compound after the mortar has been raked out to a depth of 3/4 of an inch."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"Parge the wall from the footing to ____ above finish grade line.","k":"6 inches. Parge the wall from the footing to 6\" above finish grade line."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"____ walls are self-supported (non-bearing).","k":"Curtain. Curtain walls are self-supported (non-bearing)."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"An expansion joint on the outside wythe must be spaced no farther than ____ apart.","k":"50 feet. An expansion joint on the outside wythe must be spaced no farther than 50 feet apart."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"A ____ arch is relatively weak and should be supported by steel if the opening is over 2 feet wide.","k":"Jack Arch. The Jack Arch is relatively weak and should be supported by steel if the opening is over 2 feet wide."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"Sheets of welded wire reinforcing are overlapped at least ____ plus 2 inches.","k":"one full stay spacing. Figure 18-33; Sheets of welded wire reinforcing are overlapped at least one full stay spacing plus 2 inches."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"Concrete wearing surfaces like Terrazzo toppings on outdoor slabs are generally ____ thick.","k":"1/2 inch. Concrete wearing surfaces like Terrazzo toppings on outdoor slabs are generally 1/2\" thick."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"____: Filling in cut out or defective mortar joints in masonry with fresh mortar.","k":"Tuckpointing. Tuckpointing: Filling in cut out or defective mortar joints in masonry with fresh mortar."},{"b":"Modern Masonry (Brick, Block & Stone)","a":false,"f":"____: Each continuous vertical section of masonry that is one unit in thickness.","k":"Wythe. Wythe: Each continuous vertical section of masonry that is one unit in thickness."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Never move steel deck bundles by ____.","k":"pulling on strapping. Never move bundles by pulling on strapping."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Deck bundles must be placed along the ____ lines. Bundle ends should rest on the ____.","k":"column / bearing surfaces. Deck bundles must be placed along the column lines. Bundle ends should rest on the bearing surfaces."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Standard deck widths are usually 12\", 18\", 24\", 30\", and 36\". A safe working platform should be at least ____ wide.","k":"12 feet. A safe working platform should be at least 12 feet wide."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"When placing deck, a worker should maintain a safe distance of ____ if possible from the end of a deck unit. To lower their center of gravity the worker should kneel down at the edges when placing deck.","k":"6 feet. When placing deck, a worker should maintain a safe distance of 6 feet if possible, from the end of a deck unit."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Decking used as a work platform must provide ____ for floors, or ____ for roofs.","k":"50 psf / 20 psf. Decking used as a work platform must provide 50 psf for floors or, 20 psf for roofs."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"A minimum of ____ of end bearing should be provided for deck. If deck is lapped, the lap should be over a support.","k":"1-1/2 inches. A minimum of 1-1/2\" of end bearing should be provided for deck. If deck is lapped the lap should be over a support."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Use #____ self-drilling screws for end attachments. Also known as a ____.","k":"#12 / 1/4\". Use #12 self-drilling screws for end attachments. Also known as a 1/4\"."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Weld washers are recommended for metal thickness less than ____ inches (____ gage).","k":"0.028 / 22 gage. Weld washers are recommended for metal thickness less than 0.028 inches (22 gage)."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"A good weld will have ____ or more of its perimeter working. Side welds not recommended for decks 22 gage (0.028) or lighter.","k":"7/8. A good weld will have 7/8 or more of its perimeter working. Side welds not recommended for decks 22 gage (0.028) or lighter."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"No reinforcing is needed for a deck opening of ____ as long as not more than two webs are removed.","k":"6 inches. No reinforcing is needed for an opening of 6\" as long as not more than two webs are removed."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Deck openings to 24\" perpendicular to deck require a channel (____) extended and fastened 3 ribs beyond opening on each side.","k":"c4x5.4. Openings to 24\" perpendicular to deck; require channel (c4x5.4) extended and fastened 3 ribs beyond opening on each side."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"If concrete buggies are to be used, runways should be planked and the buggies should only operate on the ____.","k":"planks. If concrete buggies are to be used runways should be planked and the buggies should only operate on the planks."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Standard deck widths are usually ____.","k":"12\", 18\", 24\", 30\", and 36\". Standard deck widths are usually 12\", 18\", 24\", 30\", and 36\". Deck is typically furnished in a standard width with the ends square cut. Any cutting for width, such as at an opening or for angular fit, is done at the jobsite."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Composite floor deck serves several purposes: (a) acts as a ____, (b) stabilizes the frame, (c) serves as concrete form for the slab, and (d) reinforces the slab to carry the design loads.","k":"working platform. Composite floor deck; Serves several purposes. It (a) acts as a working platform, (b) stabilizes the frame, (c) serves as concrete form for the slab and (d) reinforces the slab to carry the design loads."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Composite deck finishes are either galvanized or phosphatized/painted. Phosphatized/painted deck has a bare top surface, which is the side to be ____.","k":"in contact with the concrete. Composite deck finishes are either galvanized or phosphatized/painted. Phosphatized/painted deck has a bare top surface which is the side to be in contact with the concrete."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Composite decking is normally installed so the panel ends do ____ overlap on the supporting beams.","k":"not (do not). Composite decking is normally installed so the panel ends do not overlap on the supporting beams. Shear lugs or profile shape often prevent a tight metal to metal fit if panel ends overlap."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Roof deck is NOT designed to act compositely with other materials; it acts alone in transferring horizontal and vertical loads into the building frame. Roof deck is typically installed to end-lap approximately ____ over supports.","k":"2 inches. Roof deck; Is not designed to act compositely with other materials. Roof deck acts alone in transferring horizontal and vertical loads into the building frame. Roof deck is typically installed to end-lap approximately 2 inches over supports."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"____ deck can be any floor or roof deck product used as a concrete form.","k":"Form. Form deck; Can be any floor or roof deck product used as a concrete form."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"____ deck is made by attaching a bottom steel sheet to a roof or composite floor deck panel; it can be used as part of an electrical distribution system because of the chase it creates.","k":"Cellular. Cellular deck; Is made by attaching a bottom steel sheet to a roof or composite floor deck panel. Cellular deck can be used as part of an electrical distribution system because of the chase it creates."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"Standard maximum bundle weight (for decking) is ____.","k":"4,000 lbs. Standard maximum bundle weight is 4,000 lbs."},{"b":"SDI Manual of Construction with Steel Deck","a":false,"f":"If ground storage is needed, the deck bundles should be stored off the ground with one end ____ to provide drainage.","k":"elevated. If ground storage is needed the deck bundles should be stored off the ground with one end elevated to provide drainage."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Joists are designed as either underslung or with square-ends. ____ joists are supported at their ends through end bearing seats, while ____ joists are supported at the ends of the bottom chords.","k":"Underslung / square-end. Joists are designed as either underslung or with square-ends. Underslung joists are supported at their ends through end bearing seats, while square-end joists are supported at the ends of the bottom chords."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"____ is by far the most common form of conveyance for shipping joist products; open top trailers are also known as ragtops.","k":"Flat bed trailers. Joist products being shipped on flat bed trailers is by far the most common form of conveyance. Open top trailers, also known as ragtops, also lend themselves to loading joist products since the lifting crane can simply lower the joists into place after the tarpaulin is removed."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Joists and joist girders are usually shipped in the ____ position.","k":"upside-down. Figure 3-2; Joists and joist girders are usually shipped in the upside-down position."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Tag ends of a joist girder must be placed as indicated on the ____. Joist girders must be erected ____.","k":"joist placement plans / singularly. Tag ends of a joist girder must be placed as indicated on the joist placement plans. Joist girders must be erected singularly."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Setting square-ended joist girders right side up: in most cases the first diagonal web member from the support end of the girder runs from the ____ at the point of support, down to the ____.","k":"top chord / bottom chord. Figure 5.2; Become familiar with the proper orientation of square-ended joist girders. Particular attention must be paid to the setting of square-ended joist girders right side up. In most cases the first diagonal web member from the support end of the girder runs from the top chord at the point of support, down to the bottom chord (see figure 5.2)."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Since joist girders are not bridged, some bracing is normally required for the ____.","k":"bottom chord. Since joist girders are not bridged, some bracing s normally required for the bottom chord."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"OSHA safety standard required that where columns are not framed in at least two directions, joists at column lines shall be ____.","k":"field bolted. OSHA Safety standard required that where columns are not framed in at least two directions. Joists at column lines, shall be field bolted."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Immediately after each joist is set in place, both sides must be attached. This must take place before installing the ____.","k":"joist bridging. Immediately after each joist is set in place, both sides must be attached. This must take place before installing the joist bridging."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Figure 5.7 (5.9 in 4th Ed); To control top heavy conditions, an additional row of ____ bridging is required for bottom bearing joists.","k":"X-type. Figure 5.7 (Figure 5.9 in 4th); To control top heavy conditions, an additional row of X-type bridging is required for bottom bearing joists (see Figure 5.7, Figure 5.9 in 4th Edition)."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Using the bridging table, you must become familiar with the number of rows of bridging required before the hoisting cable can be released.","k":"(Table lookup skill) Using the table on page 35, you must become familiar with the number of rows of bridging required before the hoisting cable can be released."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Installing bottom chord bridging will help resist ____ forces.","k":"uplift. Installing bottom chord bridging will help resist uplift forces."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"With respect to horizontal bridging, the minimum lap is ____. Joist bridging is normally ____ in length. Furnished as ____ shape.","k":"2 inches / 20 feet / angle. With respect to horizontal bridging the minimum lap is 2 inches. Joist bridging is normally 20 feet in length. Furnished as angle shape."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"The bridging is typically furnished as an ____ shape in standard ____ lengths.","k":"angle / 20 feet. The bridging is typically furnished as an angle shape in standard 20 feet lengths."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"OSHA Safety standards strictly prohibit placing construction loads on ____ joists.","k":"un-bridged. OSHA Safety standards strictly prohibits placing construction loads on un-bridged joists."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Construction loads are defined in the OSHA safety standards as \"any load other than the ____\".","k":"employee(s), the joists and the bridging bundles. Construction loads are defined in the OSHA safety standards as \"any load other than the employee(s), the joists and the bridging bundles\"."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"The most common bridging material is ____.","k":"angle. The most common bridging material is angle."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Table 8-1; Weld to provide minimum ____ nominal strength for K-Series Joists.","k":"700 lbs. Table 8-1; Weld To Provide Minimum 700 lbs. Nominal Strength for K-Series Joists."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"OSHA requires that a bundle of bridging not exceed a total of ____.","k":"1,000 lbs. OSHA requires that a bundle of bridging not exceed a total of 1,000 lbs."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"The maximum weight of a bundle of decking is ____.","k":"4,000 lbs. The maximum weight of a bundle of decking is 4,000 lbs."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"The approximate camber for a 60-foot joist is ____.","k":"1-1/2 inches. The approximate camber for a 60-foot joist is 1-1/2 inches. (Table 4.6-1 in 4th Ed.)"},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"The SJI erection manual's \"Don't Do These Things\" list has ____ items \u2014 list them.","k":"14. 1) Don't pull or push joists off a delivery truck or drop them in any way. 2) Don't lift bundles of joist products by their strapping. 3) Don't attach cables, chains, or hooks to the web members of joists. 4) Don't store joists on their sides unless they have been shipped that way. 5) Don't place construction loads on unbridged joists. 6) Don't cause damage to the joists when field welding. 7) Don't cut away the vertical leg of bridging where bridging makes an elevation transition \u2014 weld a separate piece of bridging at the transition. 8) Don't use tack welds to secure bottom chord bridging. 9) Don't use a burn-through technique to weld bottom chord bridging. 10) Don't weld bridging to joist web members. 11) Don't hang any mechanical, electrical, etc. from bridging. 12) Don't overload joists. 13) Don't place joists between panel points on joist girders unless specifically shown on the joist placement plans. 14) Don't repair or alter joists without the approval of the registered design professional."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Bridging must be capable of resisting a horizontal force of not less than ____.","k":"700 lbs. Bridging must be capable of resisting a horizontal force of not less than 700 lbs."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Table 5.4-1; Number of rows of bridging required for a 38-foot joist with a #8 chord member = ____ rows.","k":"3 rows. Table 5.4-1; Number of rows of bridging required for a 38-foot joist with a #8 chord member - 3 rows."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"The ends of a longspan or deep longspan steel joist must extend a minimum distance of ____ over a steel support.","k":"4 inches. The ends of a longspan or deep longspan steel joist must extend a minimum distance of 4 inches over a steel support. (Figure 5.9 in 4th Edition.)"},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Note 4(B)/e2 in 4th Ed.; Where the span of the steel joist is within the blue shaded area of the load table, the hoisting cables shall not be released until ____ nearest the third points of the steel joists are installed and anchored.","k":"two rows of bolted diagonal bridging. Note 4(B) or e2 in 4th Ed.; Where the span of the steel joist is within the blue shaded area of the load table found on page 35 the hoisting cables shall not be released until the two rows of bolted diagonal bridging nearest the third points of the steel joists are installed and anchored."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Joist Table reference: Open Web bearing depth = ____, maximum depth = ____, minimum depth = ____.","k":"2-1/2\" / 30\" / 8\". Joist Table (Open Web column): Bearing Depth 2-1/2\", Maximum Depth 30\", Minimum Depth 8\", Bearing Plate Width 6\", Masonry Bearing 4\", Steel Bearing 2-1/2\", End Anchor Bolt 1/2\", End Anchor Weld 1/8\" @ 1\"."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Joist Table reference: Long Span/Deep Long Span bearing depth = ____, maximum depth = ____ / ____, minimum depth = ____ / ____.","k":"5\" / 48\"/72\" / 18\"/52\". Joist Table (Long Span/Deep Long Span column): Bearing Depth 5\", Maximum Depth 48\"/72\", Minimum Depth 18\"/52\", Bearing Plate Width 9\", Masonry Bearing 6\", Steel Bearing 4\", End Anchor Bolt 3/4\", End Anchor Weld 1/4\" @ 2\", Face of Wall to Bearing Plate 1/2\"."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"Joist Table reference: Girder bearing depth = ____, maximum depth = ____, minimum depth = ____.","k":"7-1/2\" / 120\" / 20\". Joist Table (Girder column): Bearing Depth 7-1/2\", Maximum Depth 120\", Minimum Depth 20\", Bearing Plate Width 9\", Masonry Bearing 6\", Steel Bearing 4\", End Anchor Bolt 3/4\", End Anchor Weld 1/4\" @ 2\", Face of Wall to Bearing Plate 1/2\"."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"K-Series joist depths range from ____ inches through ____ inches, at ____ inch increments.","k":"10 / 30 / 2. Depths for K-Series joists range from 10 inches through 30 inches, at 2 inch increments."},{"b":"Steel Joists (SJI Handling and Erection Manual)","a":false,"f":"K-Series joist spans range from ____ feet (or less using joist substitutes) up to ____ feet.","k":"10 / 6 al life expectancy of more than 50 years."},{"b":"Roofing Construction & Estimating","a":false,"f":"The ____ acts as a vapor retarder which protects the insulation from damage due to moisture from within the building (BUR).","k":"base sheet. The base sheet acts as a vapor retarder which protects the insulation from damage due to moisture from within the building. (BUR)"},{"b":"Roofing Construction & Estimating","a":false,"f":"Built-up roofing types: Type I = ____. Type II = ____. Type III = ____.","k":"Dead level / Flat / Most commonly used. Type I - Dead level. Type II - Flat. Type III - Most commonly used."},{"b":"Roofing Construction & Estimating","a":false,"f":"Most asphalts have a flash point ranging from ____ to ____. Don't heat asphalt to within 25\u00b0F of the flash point.","k":"437\u00b0F / 500\u00b0F. Most asphalts have a flash point ranging from 437\u00b0 to 500\u00b0F. Don't heat asphalt to within 25\u00b0F of the flash point."},{"b":"Roofing Construction & Estimating","a":false,"f":"The maximum temperature asphalt can be heated to is ____.","k":"475\u00b0F. The maximum temperature asphalt can be heated to is 475\u00b0F."},{"b":"Roofing Construction & Estimating","a":false,"f":"With a BUR, apply surface emulsions at a rate of ____ per square.","k":"3 gallons. With a BUR, apply surface emulsions at a rate of 3 gallons per square."},{"b":"Roofing Construction & Estimating","a":false,"f":"Figure 12-19; When insulating rafters (vaulted ceiling), allow ____ minimum air space for ventilation (passive ventilation).","k":"1-inch. Figure 12-19; When insulating rafters allow 1-inch minimum air space for ventilation. (Vaulted ceiling -> passive ventilation)"},{"b":"Roofing Construction & Estimating","a":false,"f":"The first and most important reason to install a vapor barrier is to prevent warm humid air from contacting a cold surface, which results in ____.","k":"condensation. The first and most important reason to install a vapor barrier is to prevent warm humid air from contacting a cold surface, which results in condensation."},{"b":"Roofing Construction & Estimating","a":false,"f":"Always install a vapor barrier in an exterior wall to the inside (____ side) of the wall. This will help prevent moisture from getting into the wall from inside the building.","k":"warm. Always install a vapor barrier in an exterior wall to the inside (warm side) of the wall. This will help prevent moisture from getting into the wall from inside the building."},{"b":"Roofing Construction & Estimating","a":false,"f":"Leaks around vent flashings are very common and are usually the result of ____.","k":"improper shingling around the flashing. Leaks around vent flashings are very common and are usually the result of improper shingling around the flashing. To repair, remove all loose material and reapply roofing cement."},{"b":"Roofing Construction & Estimating","a":false,"f":"Repair asphalt shingles by applying roof cement and sprinkling on loose granules and rubbing them into the cement. Repair asphalt shingles in ____ weather, they are more pliable.","k":"warm. Repair asphalt shingles by applying roof cement and sprinkling on loose granules and rubbing them into the cement. Repair asphalt shingles in warm weather, they are more pliable."},{"b":"Roofing Construction & Estimating","a":false,"f":"To replace a broken slate, insert the new slate underneath the ____ and nail into place.","k":"two overlapping courses. To replace a broken slate, insert the new slate underneath the two overlapping courses and nail into place."},{"b":"Roofing Construction & Estimating","a":false,"f":"To control moisture, ____ unconditioned spaces (attics). With proper ventilation air circulates freely throughout the attic carrying away the water vapor before it can condense.","k":"ventilate. To control moisture ventilate unconditioned spaces. With proper ventilation air circulates freely throughout the attic carrying away the water vapor before it can condense."},{"b":"Roofing Construction & Estimating","a":false,"f":"Figure 1-19; The roof slope factor for a 4 in 12 slope is ____.","k":"1.054. Figure 1-19; The roof slope factor for a 4 in 12 slope is 1.054."},{"b":"Roofing Construction & Estimating","a":false,"f":"Solid roof sheathing is recommended when the outside design temperature is ____ or colder. ____ is recommended for solid roof sheathing.","k":"0\u00b0F / 1x6. Solid roof sheathing is recommended when the outside design temperature is 0\u00b0F or colder. 1x6 is recommended for solid roof sheathing."},{"b":"Roofing Construction & Estimating","a":false,"f":"The spacing of the sheathing boards is equal to the ____.","k":"weather exposure. The spacing of the sheathing boards is equal to the weather exposure."},{"b":"Roofing Construction & Estimating","a":false,"f":"Underlayment is installed over the drip edge at the eaves and under the drip edge at the rakes. Figure 3-9: ____ top lap and ____ end lap.","k":"2-inch / 4-inch. Underlayment is installed over the drip edge at the eaves and under the drip edge at the rakes. Figure 3-9; 2-inch top lap and 4-inch end lap."},{"b":"Roofing Construction & Estimating","a":false,"f":"Ice dams: this particular heat loss (causing ice dams) is caused by ____.","k":"insufficient ceiling insulation. In snow-belt areas, there is sometimes enough heat loss from inside a building to melt snow on the roof. When that happens, water can leak into the walls and ceiling areas due to the freeze and thaw cycles of the snow. That cycle causes ice dams to form on the roof, also known as freeze backs. This particular heat loss is caused by insufficient ceiling insulation."},{"b":"Roofing Construction & Estimating","a":false,"f":"To prevent leaks caused by an ice dam, a rubberized product with an adhesive back, covered with release paper, should be applied to the ____.","k":"sheathing. To prevent leaks caused by an ice dam, a rubberized product with an adhesive back, covered with release paper, should be applied to the sheathing."},{"b":"Roofing Construction & Estimating","a":false,"f":"Ice or water shield flashing should be installed ____ beyond the interior face of the exterior wall line.","k":"24 inches. Ice or water shield flashing should be installed 24 inches beyond the interior face of the exterior wall line."},{"b":"Roofing Construction & Estimating","a":false,"f":"Figure 4-1; ____ protect the coating asphalt from ultra-violet rays.","k":"Mineral granules. Figure 4-1; Mineral granules protect the coating asphalt from ultra-violet rays."},{"b":"Roofing Construction & Estimating","a":false,"f":"Figure 4-52; A cricket (or saddle) is built on the ____ side of the chimney, with the same slope as the main roof.","k":"ridge. Figure 4-52; Location and configuration of a cricket or saddle. A cricket (or saddle) is built on the ridge side of the chimney, with the same slope as the main roof."},{"b":"Roofing Construction & Estimating","a":false,"f":"Figure 4-61; ____ flashing goes over step flashing.","k":"Cap or counter. Figure 4-61; Cap or counter flashing goes over step flashing."},{"b":"ANSI A117.1 (Accessible & Usable Buildings and Facilities 2017)","a":true,"f":"304.3.1.1; In new buildings and facilities the turning space shall be a circular space with a ____ minimum diameter.","k":"67\". 304.3.1.1; In new buildings and facilities the turning space shall be a circular space with a 67\" minimum diameter. See Figure 304.3.1.1"},{"b":"ANSI A117.1 (Accessible & Usable Buildings and Facilities 2017)","a":true,"f":"304.3.1.2; In existing buildings and facilities the turning space shall be a circular space with a ____ minimum diameter.","k":"60\". 304.3.1.2; In existing buildings and facilities the turning space shall be a circular space with a 60\" minimum diameter. See Figure 304.3.1.2"},{"b":"ANSI A117.1 (Accessible & Usable Buildings and Facilities 2017)","a":true,"f":"307.2; Objects with leading edges more than ____ inches, and not more than ____ inches above the floo ","a":false,"f":"Wherever possible the operator should align the direction of dozer travel with the ____.","k":"blade dump area. Wherever possible the operator should align the direction of dozer travel with the blade dump area."},{"b":"Pipe & Excavation Contracting","a":false,"f":"Dozing speeds of ____ mph range is normally the practical maximum, although dozing speeds can be as high as ____ mph.","k":"1.5 to 4 mph / 5-6 mph. Dozing speeds of 1.5 to 4 mph range is normally the practical maximum, Although dozing speeds can be as high as 5-6 mph."},{"b":"Pipe & Excavation Contracting","a":false,"f":"____ dozing can reduce the amount of load lost. A U-shaped blade will also do this.","k":"Slot. Slot dozing can reduce the amount of load lost. U-shaped blade will also do this."},{"b":"Pipe & Excavation Contracting","a":false,"f":"____ dozing lets you move soil when there's no way to attack it from the rear.","k":"Angle. Angle dozing lets you move soil when there's no way to attack it from the rear."},{"b":"Pipe & Excavation Contracting","a":false,"f":"Finish blading (NOT grading) is the hardest part of a grader's work.","k":"Finish blading is the hardest part of a grader's work. (Note: it's blading, not grading.)"},{"b":"Pipe & Excavation Contracting","a":false,"f":"Scrapers are built with sturdy push blocks located at the rear of the machine. Any scraper will be more productive, especially in hard or muddy soil, when assisted by a ____ pushing on the push blocks to the rear of the bowl.","k":"pusher tractor. Scrapers are built with sturdy push blocks located at the rear of the machine. Any scraper will be more productive, especially in hard or muddy soil, when assisted by a pusher tractor pushing on the push blocks to the rear of the bowl."},{"b":"Pipe & Excavation Contracting","a":false,"f":"It is standard practice to show horizontal distance in multiples of ____. A station equals ____.","k":"100 feet / 100 feet. It is standard practice to show horizontal distance in multiples of 100 feet. A station equals 100 feet."},{"b":"Pipe & Excavation Contracting","a":false,"f":"The nuclear density test is the fastest compaction test method because it can be done ____.","k":"on site. The nuclear density test is the fasted method because it can be done on site."},{"b":"Pipe & Excavation Contracting","a":false,"f":"____ and gravel compact well with water and vibration.","k":"Sand. Sand and gravel compact well with water and vibration."},{"b":"Pipe & Excavation Contracting","a":false,"f":"____ is the easiest soil compaction method.","k":"Puddling. Puddling is the easiest soil compaction method."},{"b":"Pipe & Excavation Contracting","a":false,"f":"____ roller is the best method to compact soils in wide trenches with no cross lines.","k":"The sheepsfoot. The sheepsfoot roller is the best method to compact soils in wide trenches with no cross lines."},{"b":"Pipe & Excavation Contracting","a":false,"f":"____ blocks are designed to resist the pressure in pipes at elbows and tees. ____ is the only acceptable thrust block material.","k":"Thruster / Concrete. Thruster blocks are designed to resist the pressure in pipes at elbows and tees. Concrete is the only acceptable thrust block."},{"b":"Pipe & Excavation Contracting","a":false,"f":"Contour lines show elevation. In relatively flat areas the contour lines are ____ spaced. On steep slopes contour lines will be ____ together.","k":"widely / closer. Contour lines show elevation. In relatively flat areas the contour lines are widely spaced. On steep slopes contour lines will be closer together."},{"b":"Pipe & Excavation Contracting","a":false,"f":"Contour lines that form a closed loop represent either a ____ or a ____.","k":"summit / depression. Contour lines that form a closed loop represent either a summit or a depression."},{"b":"Pipe & Excavation Contracting","a":false,"f":"____ rock is the easiest to rip. ____ rock tends to be the hardest rock to rip.","k":"Sedimentary / Igneous. Sedimentary rock is the easiest to rip. Igneous rock tends to be the hardest rock to rip."},{"b":"Pipe & Excavation Contracting","a":false,"f":"The shock wave of an explosion travels in the direction of least resistance, rarely ____.","k":"down. The shock wave of an explosion travels in the direction of least resistance, rarely down."},{"b":"Pipe & Excavation Contracting","a":false,"f":"The level of underground water is known as the ____. Because of varying soil conditions and seasonal rainfall, it will vary season to season.","k":"water table. The level of underground water is known as the water table. Because of varying soil conditions and seasonal rainfall, the water table will vary season to season."},{"b":"Pipe & Excavation Contracting","a":false,"f":"On jobs where compaction is important, you must replace ____ with ____.","k":"soaked soil / dry fill. On jobs where compaction is important, you must replace soaked soil with dry fill."},{"b":"Pipe & Excavation Contracting","a":false,"f":"A ____ system is the best way to dewater a trench and works very well in ____ (coarse grained).","k":"wellpoint / sandy soils. A wellpoint system is the best way to dewater a trench and works very well in sandy soils. (Coarse grained)"},{"b":"Pipe & Excavation Contracting","a":false,"f":"A ____ degree slope is a 100% slope.","k":"45 degree. A 45 degree slope is a 100% slope."},{"b":"Pipe & Excavation Contracting","a":false,"f":"A ____ is the length of trench that a hoe can excavate from one position.","k":"set. A set is the length of trench that a hoe can excavate from one position."},{"b":"Pipe & Excavation Contracting","a":false,"f":"Depending on the soil type, the heaped capacity is usually about ____ of the struck capacity.","k":"130%. Depending on the soil type, the heaped capacity is usually about 130% of the struck capacity."},{"b":"Pipe & Excavation Contracting","a":false,"f":"For trenches deeper than ____ or in extremely hard digging, the ____ backhoe should be your first choice.","k":"8 feet / tracked. For trenches deeper than 8 feet or in extremely hard digging, the tracked backhoe should be your first choice."},{"b":"Pipe & Excavation Contracting","a":false,"f":"The easiest and best method to protect against cave-ins is to slope the trench walls to the ____ for the type of soil you are working in.","k":"angle of repose. The easiest and best method to protect against cave-ins is to slope the trench walls to the angle of repose for the type of soil you are working in. (See Figure 5-22)"},{"b":"Pipe & Excavation Contracting","a":false,"f":"____ are the best choice when working in firm soil that will stay in place long enough for the jacks to be positioned.","k":"Shoring jacks. Shoring jacks are the best choice when working in firm soil that will stay in place long enough for the jacks to be positioned."},{"b":"Pipe & Excavation Contracting","a":false,"f":"____ are the best shoring option when working in very unstable ground.","k":"Trench boxes. Trench boxes are the best shoring option when working in very unstable ground."},{"b":"Pipe & Excavation Contracting","a":false,"f":"The operator needs to avoid positioning the trench box too high. If it is more than ____ above the pipe the ditch will be unsafe.","k":"5 feet. The operator needs to avoid positioning the trench box too high. If it is more than 5 feet above the pipe the ditch will be unsafe."},{"b":"Pipe & Excavation Contracting","a":false,"f":"____ backhoes can work in several feet of slimy mud.","k":"Tracked. Tracked backhoes can work in several feet of slimy mud."},{"b":"Pipe & Excavation Contracting","a":false,"f":"Soil Structure: When soil is excavated or in some way disturbed from its natural state, it ____, increasing in volume. When soil is compacted, it ____, decreasing in volume.","k":"swells / shrinks. When soil is excavated or in some way disturbed from its natural state, it swells, increasing in volume. When soil is compacted, it shrinks, decreasing in volume."},{"b":"Pipe & Excavation Contracting","a":false,"f":"Soil under building slabs, sidewalks, etc., are usually specified at ____ of maximum dry density for cohesive soil or ____ of maximum dry density for non-cohesive soils.","k":"90% / 95%. Soil under building slabs, sidewalks, etc., are usually specified at 90% of maximum dry density for cohesive soil or 95% of maximum dry density for non-cohesive soils."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"1.3.1 Warm Season; ____ grass is the grass of choice for nearly all warm sports turf surfaces.","k":"Bermuda. 1.3.1 Warm Season; Bermuda grass is the grass of choice for nearly all warm sports turf surfaces."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"1.3.3 Cool Season; For sports in the cool season regions of North America, the primary choices are ____ and ____.","k":"Kentucky bluegrass / perennial ryegrasses. 1.3.3 Cool Season; For sports in the cool season regions of North America, the primary choices are Kentucky bluegrass and perennial ryegrasses."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"1.7 Soil Preparation; Fertilizers should be incorporated into the top ____ of the soil.","k":"6 inches. 1.7 Soil Preparation; Fertilizers should be incorporated into the top 6\" of the soil."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"Seeding; one of the least expensive and most effective mulches is a weed-free small grain straw. A rule of thumb in how much to use is approximately ____ per 1,000 square feet.","k":"one bale. Seeding; One of the least expensive and most effective mulches is a weed-free small grain straw (wheat, barley, etc.). A rule of thumb in how much to use is approximately one bale per 1,000 square feet."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"1.8.2 Pre-Germination; one method to pre-germinate seed is to put seed in a cloth bag and soak it in a large drum of warm water for at least ____.","k":"12 hours. 1.8.2 Pre-Germination; One of the simplest methods used to pre-germinate seed is to put seed in a cloth bag and soak it in a large drum of warm water for at least 12 hours."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"2.2.5 Importance of Soil Testing; A good rule of thumb is to have a representative sample for every ____ of area (approximately 20,000 square feet).","k":"half acre. 2.2.5 The Importance of Soil Testing; A good rule of thumb is to have a representative sample for every half acre (approximately 20,000 square feet) of area."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"3.4 Soil Reaction; one of the most important pieces of information gained from a soil test is soil reaction, most commonly referred to as ____.","k":"soil PH. 3.4 Soil Reaction; One of the most important pieces of information gained from a soil test is soil reaction, most commonly referred to as the soil PH."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"4.1.2 Rule Number 2, \"The One-Third Rule\": cut off no more than ____ of the grass blade at a single mowing.","k":"one-third. 4.1.2 Rule Number 2; \"The One-Third Rule\"; cut off no more than one-third of the grass blade at a single mowing."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"4.2.2 Reel Mowers; Reel mower units provide the highest quality cut available, and the most acceptable cut at mowing heights of less than ____.","k":"2 inches. 4.2.2 Reel Mowers; Reel mower units provide the highest quality cut available, and the most acceptable cut at mowing heights of less than 2 inches."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"____ fields are the most common type of football field today; this design normally can be expected to shed water fairly successfully.","k":"Crowned. Crowned fields are the most common type of football field today, this design normally can be expected to shed water fairly successfully."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"The most common type of aeration is ____.","k":"hollow-tine core aeration. The most common type of aeration is hollow-tine core aeration."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"The outfield should slope downward from the arc of the skinned area to the outfield fence at a rate of ____.","k":"1%. The outfield should slope downward from the arc of the skinned area to the outfield fence at a rate of 1%."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"12.2.6 Skinned Area Materials (Sand, silt, clay); a good average to remember for most baseball and softball fields is roughly ____% sand, ____% silt, and ____% clay.","k":"70% / 15% / 15%. 12.2.6 Skinned Area Materials; Sand, silt, clay. A good average to remember for most baseball and softball fields is roughly 70% sand, 15% silt, and 15% clay."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"To insure optimal pitcher's mound or batter's box performance, a ____ soil material should be installed.","k":"clay-based. To insure optimal pitcher's mound or batter's box performance, a clay-based soil material should be installed."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"Pitcher's mound/batter's box construction: a thin layer (1/2\" to 1\") of bagged clay is used under and on top of unfired clay bricks. Skinned area material (____) is used on top to prevent slipping.","k":"1/4\" to 1/2\". Figure 12.13; A thin layer (1/2\" to 1\") of bagged clay is used under and on top of unfired clay bricks. Skinned area material (1/4\" to 1/2\") is used on top to prevent slipping."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"Figure 12.27; Dragging should be conducted at low speeds, and should begin ____ from the grass edge to avoid getting dirt into the grass.","k":"12 inches. Figure 12.27; Dragging should be conducted at low speeds, and should begin 12 inches from the grass edge to avoid getting dirt into the grass."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"Catch Basins - Sand Channel Drains: a 2-inch perforated pipe or strip drain (cloth-wrapped polyethylene structure 1\" wide and 6\" deep) is placed in the bottom of the trench on a ____ of sand.","k":"1/2 inch. Catch Basins: Sand Channel Drains; A 2-inch perforated pipe or strip drain (cloth-wrapped polyethylene structure 1\" wide ad 6\" deep) is placed in the bottom of the trench on a 1/2 inch of sand."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"13.6.1; For a football field the top of the goal post crossbar is ____.","k":"10 feet. 13.6.1; For a football field the top of the goal post crossbar is 10 feet."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"14.2.2 With soccer, lacrosse and field hockey fields where the terrain permits, side-to-side sloped fields should have a slope of ____ to ____ to provide adequate surface drainage.","k":"1 1/4 percent / 1 1/2 percent. 14.2.2 With soccer, lacrosse and field hockey fields where the terrain permits, side-to-side sloped fields can work very well. Side-to-side fields should have a slope of 1 1/4 percent to 1 1/2 percent to provide adequate surface drainage."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"15.2.1 Layout; Tennis courts need to be oriented a little differently in the northern US than in the South. In the North a ____ orientation is used most often. In the South, it is better to orient the court 15 to 25 degrees off true north, in a northwest-southeast direction.","k":"north-south. 15.2.1 Layout; Tennis courts need to be oriented a little differently in the northern United States than in the South. In the North a north-south orientation is used most often. In the South, it is better to orient the court 15 to 25 degrees off true north, in a northwest-southeast direction."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"15.2.3 Court designs with preferred contours; A tennis court surface should never have a ____ or a ____ at the net.","k":"crown / swale. 15.2.3 Court designs with preferred contours; A tennis court surface should never have a crown or a swale at the net."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"15.2.5; The most common nonporous surfaces for tennis courts are paved surfaces of concrete or asphalt with a ____.","k":"color coating. 15.2.5; The most common nonporous surfaces for tennis courts are paved surfaces of concrete or asphalt with a color coating."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"The only type of installed drain system recommended for clay or fast-dry court is a traditional pipe drain system with ____ pipes and pea gravel to within ____ of the surface.","k":"4-inch / 4-inches. The only type of installed drain system recommended for clay or fast-dry court is a traditional pipe drain system with 4-inch pipes and pea gravel to within 4-inches of the surface."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"All-weather Tracks; Rubber coatings on tracks are installed to a depth of ____.","k":"3/8\" to 1/2\". All-weather Tracks; Rubber coatings on tracks are installed to a depth of 3/8\" to 1/2\"."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"18.3.1; A ____ is the elevation of a fixed reference point like a catch basin lid or an existing curb.","k":"Benchmark. 18.3.1; A Benchmark is the elevation of a fixed reference point like a catch basin lid or an existing curb."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"21.5.1; The most common used device for testing field hardness is the ____, also known as the Clegg Impact Tester.","k":"Clegg Hammer. 21.5.1; The most common used device for testing field hardness is the Clegg Hammer, also known as the Clegg Impact Tester."},{"b":"Sports Fields (Design, Construction and Maintenance)","a":true,"f":"1.1; PLS calculation: multiply the purity percentage by the germination percentage to yield Pure Live Seed (PLS) %. A 50 lb bag of seed with 95% purity and 95% germination has a PLS of approximately ____%, meaning the bag contains ____ lbs of PLS.","k":"90% / 45 lbs. 1.1; A simple calculation of multiplying the purity percentage by the germination percentage will yield a pure live seed (PLS) percentage in the bag. For example, a 50 pound bag of ABC perennial ryegrass with 95 percent purity and 95 percent germination will have a PLS of approximately 90 percent (0.95x0.95=90%). This means that a 50 pound bag of seed contains 45 pounds of PLS."},{"b":"One Call (NC Excavation Manual)","a":false,"f":"What needs to be included for a notification? (9 items) Company telephone number, Company address, Caller name, Email address, County, Place/City/Town, In or out of city limits, Subdivision, and ____.","k":"Address. What needs to be included for a notification: 1) Company telephone number 2) Company address 3) Caller name 4) Email address 5) County 6) Place/City/Town 7) In or out of city limits 8) Subdivision 9) Address."},{"b":"One Call (NC Excavation Manual)","a":false,"f":"A notification can contain many addresses on a ticket as long as the addresses are on one street within a ____ range (like 2300-2325). If the block changes (like 2300-2400) a ____ is required.","k":"one block / second notification. A notification can contain many addresses on a ticket as long as the addresses are on one street within a one block range. Like 2300-2325. If the block changes (like 2300-2400) a second notification is required."},{"b":"One Call (NC Excavation Manual)","a":false,"f":"Wait the required ____ for the excavation site to be marked before you begin digging.","k":"3 business days. Wait the required 3 business days for the excavation site to be marked before you begin digging."},{"b":"One Call (NC Excavation Manual)","a":false,"f":"One Call tickets are good for ____ working days.","k":"15 working days. Tickets are good for 15 working days."},{"b":"One Call (NC Excavation Manual)","a":false,"f":"One Call color codes: Red = ____. Yellow = ____.","k":"Power lines, cable conduit and lighting cables / Gas, oil, steam, petroleum or gaseous material. Red - Power lines, cable conduit and lighting cables. Yellow - Gas, oil, steam, petroleum or gaseous material."},{"b":"One Call (NC Excavation Manual)","a":false,"f":"One Call color codes: Orange = ____. Blue = ____.","k":"Communication, cable tv, alarm, signal lines and cables or conduit / Potable water. Orange - Communication, cable tv, alarm, signal lines, and cables or conduit. Blue - Potable water."},{"b":"One Call (NC Excavation Manual)","a":false,"f":"One Call color codes: Green = ____. White = ____.","k":"Sewer or drain lines / Proposed excavation. Green - Sewer or drain lines. White - Proposed excavation."},{"b":"One Call (NC Excavation Manual)","a":false,"f":"One Call color codes: Pink = ____. Purple = ____.","k":"Temporary survey markings / Reclaimed water, irrigation or slurry lines. Pink - Temporary survey markings. Purple - Reclaimed water, irrigation or slurry lines."},{"b":"One Call (NC Excavation Manual)","a":false,"f":"It is NOT the duty of the ____ to assist in locating and marking underground utilities.","k":"excavator. Miscellaneous: It is not the duty of the excavator to assist in locating and marking underground utilities."},{"b":"Sediment Control (NC Sediment Control Law)","a":false,"f":"An erosion and sedimentation control plan must be submitted at least ____ before land disturbance begins on any site 1 acre or larger.","k":"30 days. An erosion and sedimentation control plan must be submitted at least 30 days before land disturbance begins on any site 1 acre or larger."},{"b":"Sediment Control
